# 云服务器用（Linux + Docker）。本机 Windows 过渡期不需要这个文件。
# 首次：docker compose up -d，然后 docker compose logs napcat 看登录二维码；
# 面板用 SSH 隧道访问，端口只绑定在 127.0.0.1 上。
services:
  napcat:
    image: mlikiowa/napcat-docker:latest   # 上线前改成固定版本号
    container_name: napcat
    restart: always
    environment:
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
      - ./astrbot/data:/AstrBot/data   # 让发语音、发图时文件路径两边一致

  astrbot:
    image: soulter/astrbot:latest          # 上线前改成固定版本号
    container_name: astrbot
    restart: always
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:6185:6185"
    volumes:
      - ./astrbot/data:/AstrBot/data
      - ../plugins/astrbot_plugin_dafeiyu:/AstrBot/data/plugins/astrbot_plugin_dafeiyu
